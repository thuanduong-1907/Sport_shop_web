<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="jerseyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg2)" rx="16"/>
  <ellipse cx="250" cy="405" rx="140" ry="16" fill="#94a3b8" opacity="0.4"/>
  <g filter="url(#sh2)">
    <!-- Jersey Body and Sleeves -->
    <path d="M180,95 L140,140 L70,180 L110,245 L155,210 L155,385 C155,395 165,400 175,400 L325,400 C335,400 345,395 345,385 L345,210 L390,245 L430,180 L360,140 L320,95 C290,120 210,120 180,95 Z" fill="url(#jerseyGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Gold Stripes -->
    <path d="M175,100 L115,190" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M185,102 L125,192" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M195,105 L135,195" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M325,100 L385,190" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M315,102 L375,192" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M305,105 L365,195" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Collar -->
    <path d="M205,105 C225,135 275,135 295,105 C280,125 220,125 205,105 Z" fill="#1e293b"/>
    <!-- Adidas Logo Right Chest -->
    <g transform="translate(200, 160) scale(0.6)">
      <polygon points="10,25 20,25 35,5 25,5" fill="url(#goldGrad)"/>
      <polygon points="25,25 35,25 50,0 40,0" fill="url(#goldGrad)"/>
      <polygon points="40,25 50,25 65,-5 55,-5" fill="url(#goldGrad)"/>
    </g>
    <!-- Real Madrid Crest Left Chest -->
    <g transform="translate(290, 150)">
      <circle cx="15" cy="15" r="16" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="3"/>
      <circle cx="15" cy="15" r="12" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
      <polygon points="5,0 10,-8 15,-2 20,-8 25,0" fill="url(#goldGrad)"/>
      <text x="15" y="19" fill="url(#goldGrad)" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MC</text>
    </g>
    <!-- Sponsor: Emirates FLY BETTER -->
    <text x="250" y="255" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="2">Emirates</text>
    <text x="250" y="275" fill="#d97706" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="3">FLY BETTER</text>
    <!-- Number 9 and Player Name -->
    <text x="250" y="350" fill="#0f172a" font-family="sans-serif" font-size="50" font-weight="900" text-anchor="middle" opacity="0.85">9</text>
    <text x="250" y="375" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="4">MBAPPÉ</text>
  </g>
  <text x="250" y="445" fill="#0f172a" font-family="sans-serif" font-size="17" font-weight="800" text-anchor="middle">ÁO ĐẤU REAL MADRID 2024/25</text>
  <text x="250" y="470" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Player Version - Trắng Hoàng Gia</text>
</svg>